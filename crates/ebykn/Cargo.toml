[package]
name = "ebykn"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ebykn"
path = "src/main.rs"

[dependencies]
ebykn_check = { path = "../ebykn_check" }
ebykn_syntax = { path = "../ebykn_syntax" }
toml = { version = "0.9", default-features = false, features = ["parse", "std"] }
