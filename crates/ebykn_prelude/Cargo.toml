# Ebykn の書き下しが参照する Verus クレート（仕様 §7.1）。
# Verus の toolchain で検証する（`cargo xtask verus-verify`）。ルートの Cargo ワークスペースには入れない。
[package]
name = "ebykn_prelude"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# ルートの Cargo.toml の [workspace.metadata.verus] の vstd と同じ版にする（check-verus-pin が検査する）。
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
