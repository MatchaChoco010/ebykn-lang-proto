name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gates

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook --version
      - run: mdbook build book

  # 固定した Verus（ルートの Cargo.toml の [workspace.metadata.verus]）で prelude・手書きの stack・プローブを検証する。
  verus:
    runs-on: ubuntu-latest
    env:
      # xtask は XDG_CACHE_HOME を優先する。キャッシュするパスと食い違わないよう明示する。
      XDG_CACHE_HOME: /home/runner/.cache
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: 固定値を読む
        id: pin
        run: |
          meta=$(cargo metadata --format-version 1 --no-deps)
          echo "version=$(echo "$meta" | jq -r .metadata.verus.version)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$meta" | jq -r .metadata.verus.sha256)" >> "$GITHUB_OUTPUT"
      - name: Verus のキャッシュ
        uses: actions/cache@v4
        with:
          path: ${{ env.XDG_CACHE_HOME }}/ebykn/verus/${{ steps.pin.outputs.version }}
          key: verus-${{ steps.pin.outputs.sha256 }}
      # vstd などの crates.io の依存。ビルド成果物（数百 MB）は復元と再ビルドの時間が変わらないので入れない。
      - name: crates.io の依存のキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: verus-registry-${{ steps.pin.outputs.sha256 }}
      - run: cargo xtask verus-install
      - run: cargo xtask verus-verify
      - run: cargo xtask verus-probes

  # ブランチ保護が見る必須チェックはこれだけ。ジョブを足したら needs にも足す。
  ci-required:
    needs: [fmt, clippy, test, gates, book, verus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 全ジョブの成功を確かめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
