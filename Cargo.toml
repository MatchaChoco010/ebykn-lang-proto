[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Verus のクレートは Verus の toolchain で検証する（`cargo xtask verus-verify`）。
exclude = ["crates/ebykn_prelude", "tests/golden"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# 固定した Verus（仕様 §1.3）。`cargo xtask verus-install` が読む。
[workspace.metadata.verus]
release = "release/0.2026.11.02.8bf68ee"
version = "0.2026.11.02.8bf68ee"
commit = "8bf68ee741df833ea5d0fe6a2255126fdea87e47"
asset = "verus-0.2026.11.02.8bf68ee-x86-linux.zip"
sha256 = "f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c"
toolchain = "1.99.1-x86_64-unknown-linux-gnu"
vstd = "=0.0.0-2026-11-01-0251"
